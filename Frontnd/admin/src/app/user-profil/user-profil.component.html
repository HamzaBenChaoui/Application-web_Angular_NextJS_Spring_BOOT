<div class="flex items-center justify-center h-full">
  <div class="bg-white dark:bg-gray-800 shadow-sm rounded-xl p-6 w-full border border-gray-200 dark:border-gray-700">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h2 class="text-xl font-semibold text-gray-900 dark:text-white">Users</h2>
        <p class="text-sm text-gray-500 dark:text-gray-400">A list of all the users in your account including their name, email and role.</p>
      </div>
      <button (click)="openAddUserModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
        Add user
      </button>
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
        <thead>
          <tr>
            <th class="px-4 py-3 text-left text-sm font-semibold text-gray-900 dark:text-white">Name</th>
            <th class="px-4 py-3 text-left text-sm font-semibold text-gray-900 dark:text-white">Email</th>
            <th class="px-4 py-3 text-left text-sm font-semibold text-gray-900 dark:text-white">Role</th>
            <th class="px-4 py-3 text-right text-sm font-semibold text-gray-900 dark:text-white">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100 dark:divide-gray-700">
          <tr *ngFor="let user of users" class="hover:bg-gray-50 dark:hover:bg-gray-700">
            <td class="px-4 py-4 text-sm font-medium text-gray-900 dark:text-white">{{ user.nom }}</td>
            <td class="px-4 py-4 text-sm text-gray-500 dark:text-gray-400">{{ user.email }}</td>
            <td class="px-4 py-4 text-sm text-gray-500 dark:text-gray-400">{{ user.role }}</td>
            <td class="px-4 py-4 text-right text-sm space-x-3">
              <button (click)="openEditModal(user)" class="text-indigo-600 hover:text-indigo-900 font-medium">Edit</button>
              <button (click)="openDeleteModal(user)" class="text-red-600 hover:text-red-900 font-medium">Delete</button>
            </td>
          </tr>
          <tr *ngIf="users.length === 0">
            <td colspan="4" class="px-4 py-4 text-sm text-gray-500 dark:text-gray-400 text-center">No users found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Add User Modal -->
<div *ngIf="showAddUserModal" class="fixed inset-0 bg-gray-900 bg-opacity-60 flex items-center justify-center transition-opacity duration-300">
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-md transform transition-all duration-300 scale-95">
    <div class="flex justify-between items-center border-b border-gray-200 dark:border-gray-700 pb-3">
      <h3 class="text-xl font-semibold text-gray-900 dark:text-white">Add New User</h3>
      <button (click)="closeAddUserModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <form (ngSubmit)="addUser()" class="mt-4">
      <div class="mb-4">
        <label for="add-user-nom" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Name</label>
        <input type="text" id="add-user-nom" [(ngModel)]="newUser.nom" name="nom" required class="w-full px-3 py-2 text-gray-900 bg-gray-50 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:focus:ring-indigo-500">
      </div>
      <div class="mb-4">
        <label for="add-user-email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email</label>
        <input type="email" id="add-user-email" [(ngModel)]="newUser.email" name="email" required class="w-full px-3 py-2 text-gray-900 bg-gray-50 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:focus:ring-indigo-500">
      </div>
      <div class="mb-4">
        <label for="add-user-password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
        <input type="password" id="add-user-password" [(ngModel)]="newUser.password" name="password" required class="w-full px-3 py-2 text-gray-900 bg-gray-50 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:focus:ring-indigo-500">
      </div>
      <div class="mb-6">
        <label for="add-user-role" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Role</label>
        <select id="add-user-role" [(ngModel)]="newUser.role" name="role" required class="w-full px-3 py-2 text-gray-900 bg-gray-50 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:focus:ring-indigo-500">
          <option *ngFor="let role of userRoles" [value]="role">{{ role }}</option>
        </select>
      </div>
      <div class="flex justify-end gap-4">
        <button type="button" (click)="closeAddUserModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 border border-gray-300 rounded-md shadow-sm hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-500 dark:hover:bg-gray-600">Cancel</button>
        <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 border border-transparent rounded-md shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Add User</button>
      </div>
    </form>
  </div>
</div>

<!-- Edit User Modal -->
<div *ngIf="showEditModal" class="fixed inset-0 bg-gray-900 bg-opacity-60 flex items-center justify-center transition-opacity duration-300">
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-md transform transition-all duration-300 scale-95">
    <div class="flex justify-between items-center border-b border-gray-200 dark:border-gray-700 pb-3">
      <h3 class="text-xl font-semibold text-gray-900 dark:text-white">Edit User</h3>
      <button (click)="closeEditModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <form *ngIf="userToEdit" (ngSubmit)="saveEdit()" class="mt-4">
      <div class="mb-4">
        <label for="edit-user-nom" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Name</label>
        <input type="text" id="edit-user-nom" [(ngModel)]="userToEdit.nom" name="nom" required class="w-full px-3 py-2 text-gray-900 bg-gray-50 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:focus:ring-indigo-500">
      </div>
      <div class="mb-4">
        <label for="edit-user-email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email</label>
        <input type="email" id="edit-user-email" [(ngModel)]="userToEdit.email" name="email" required class="w-full px-3 py-2 text-gray-900 bg-gray-50 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:focus:ring-indigo-500">
      </div>
      <div class="mb-6">
        <label for="edit-user-role" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Role</label>
        <select id="edit-user-role" [(ngModel)]="userToEdit.role" name="role" required class="w-full px-3 py-2 text-gray-900 bg-gray-50 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:focus:ring-indigo-500">
          <option *ngFor="let role of userRoles" [value]="role">{{ role }}</option>
        </select>
      </div>
      <div class="flex justify-end gap-4">
        <button type="button" (click)="closeEditModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 border border-gray-300 rounded-md shadow-sm hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-500 dark:hover:bg-gray-600">Cancel</button>
        <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 border border-transparent rounded-md shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div *ngIf="showDeleteConfirm" class="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center">
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 text-center">
    <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-4">
      Are you sure you want to delete <span class="font-semibold text-red-600">{{ selectedUser?.nom }}</span>?
    </h3>
    <div class="flex justify-center space-x-4">
      <button (click)="confirmDelete()" class="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700">
        Yes, delete
      </button>
      <button (click)="closeDeleteModal()" class="bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white px-4 py-2 rounded-md hover:bg-gray-300 dark:hover:bg-gray-500">
        Cancel
      </button>
    </div>
  </div>
</div>
