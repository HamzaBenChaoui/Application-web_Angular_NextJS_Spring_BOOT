# Server Configuration
server.port=8081
server.servlet.context-path=/api

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/kaoba_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
# CRITICAL: If your 'root' user has a password, you MUST set it here.
# Leaving it blank will cause an "Access denied" error.
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# FIX: Renamed 'jwt.secret' to 'jwt.secret.key' to match the property 
# name expected by the JwtTokenProvider (@Value("${jwt.secret.key}")).
jwt.secret.key=ThisIsASecretKeyForJWTThatIsLongEnoughForHS256AndSecure enough
jwt.expiration.time=86400000

